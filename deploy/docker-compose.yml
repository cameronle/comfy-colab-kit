# Optional container deployment (native systemd via deploy/comfy-gate.service is preferred on VPS).
name: comfy-colab-kit
services:
  comfy-gate:
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: comfy-colab-kit/gate:local
    container_name: comfy-gate
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOME: /data/home
      PYTHONPATH: /app/apps
    volumes:
      - ../data:/data
      - ../apps/gate:/app/apps/gate:ro
      - ../profiles:/app/profiles:ro
      - ../packages/colab:/app/packages/colab:ro
      - ../apps/gate/web:/app/apps/gate/web:ro
    secrets: [agent_token, hf_token]
    networks: [caddy]
    expose: ["8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

secrets:
  agent_token: {file: ../secrets/agent_token}
  hf_token: {file: ../secrets/hf_token}

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
