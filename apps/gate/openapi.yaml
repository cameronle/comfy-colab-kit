openapi: 3.1.0
info:
  title: comfy-gate
  version: 0.1.0
  description: |
    Headless batch gateway for ComfyUI on Google Colab; no Colab web listener or tunnel.
    One shared GPU profile per gate. Wake joins only a matching in-flight/running profile;
    a different profile returns 409 profile_mismatch. Explicit switching is refused while
    jobs are queued/running. Query /_gate/profiles without allocating compute, then use
    /_gate/txt2img for validated profile-aware quick generation or /prompt for API graphs.
servers:
  - url: https://comfy.example.com
security:
  - cfAccess: []
  - agentBearer: []
components:
  securitySchemes:
    cfAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Injected by Cloudflare Access; RS256 JWT verified against the team JWKS and CF_ACCESS_AUD.
    agentBearer:
      type: http
      scheme: bearer
      description: Device-paired application token (or legacy AGENT_TOKEN_FILE); owner privileges follow the verified token identity.
  schemas:
    State:
      type: string
      enum: [sleeping, allocating, installing, downloading, booting, smoke_testing, ready, switching, stopping, failed]
    Status:
      type: object
      properties:
        state: {$ref: "#/components/schemas/State"}
        profile: {type: [string, "null"]}
        reason: {type: string}
        since: {type: number}
        session_started: {type: [number, "null"]}
        extends_used: {type: integer}
        busy: {type: boolean, description: true while starting/stopping — the Wake button shows "Starting…" for everyone}
        progress:
          type: object
          properties:
            stage: {type: string}
            download:
              type: object
              properties: {done_gb: {type: number}, total_gb: {type: number}, files_done: {type: integer}, files_total: {type: integer}, gbps: {type: number}}
        remaining_s: {type: [number, "null"]}
        warn: {type: string, enum: ["", session_ending]}
        can_extend: {type: boolean}
        cu: {type: object, properties: {today: {type: number}, month: {type: number}, balance: {type: [number, "null"]}, per_hour: {type: number}}}
        clients: {type: integer}
        default_view: {type: string, enum: [app, graph]}
        you: {type: object, properties: {email: {type: string}, owner: {type: boolean}}}
        owner_only: {type: array, items: {type: string}}
        version: {type: string}
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: |
            no_access_token | invalid_token | bad_alg | unknown_kid | no_email | not_allowed | bad_agent_token |
            owner_only | unknown_profile | quiet_hours | daily_budget | monthly_budget | low_balance |
            extend_limit | asleep | backend_unreachable | profile_mismatch | queue_busy |
            unsupported_profile | unsupported_workflow | unsupported_parameter | unsupported_preset |
            invalid_parameter | invalid_dimensions | invalid_reference | template_mismatch
        message: {type: string}
  responses:
    Unauthorized: {description: Missing/invalid Access JWT or bearer, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Forbidden: {description: Not allowed (email not allowed or owner-only action), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
paths:
  /_gate/healthz:
    get:
      security: []
      summary: Liveness (no auth)
      responses: {"200": {description: ok}}
  /_gate/status:
    get:
      summary: Shared session status
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Status"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /_gate/events:
    get:
      summary: Server-Sent Events stream shared by every viewer
      description: |
        Events: `state` (Status JSON), `progress` (progress object), `log` (string; setup output, backlog replayed on connect),
        `warn` ({warn, remaining_s}). Comment pings every 20 s.
      responses: {"200": {description: text/event-stream}}
  /_gate/profiles:
    get:
      summary: Available profiles, per-model quick-generation capabilities and validation errors
      description: |
        Does not wake or allocate compute. Each profile's generation object describes
        available, workflow_id, presets, default_preset, negative_prompt, reference_image,
        default_negative, dimension_multiple, default_width/default_height, sizes and license.
        Unsupported adapters have available=false and a reason. Other workflows listed
        in a profile are not automatically supported by the quick-generation endpoint.
      responses: {"200": {description: ok}}
  /_gate/txt2img:
    post:
      summary: Queue a profile-aware image job
      description: |
        Preserves the complete prompt string. The selected profile chooses the graph;
        omitted parameters use profile-specific defaults. Currently connects MOSS
        matlowai-presets, Qwen qwen21-turbo-t2i (8 steps), and SD sd35-large (20 steps).
        Unsupported parameters are rejected, not silently ignored. Qwen Turbo uses
        CFG=1 and rejects nonempty negative prompts. Reference editing is MOSS-only.
        auto_wake=true requires wake permission and may allocate paid Colab compute;
        it never switches an active GPU to another profile. A timeout never replays a job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt]
              properties:
                prompt: {type: string, minLength: 1, description: Full original positive prompt; whitespace is preserved}
                profile: {type: string, description: Defaults to the current profile or configured default}
                workflow: {type: string, description: Must match the generation.workflow_id advertised for this profile}
                preset: {type: string, description: Select from generation.presets; omit for the model default}
                negative_prompt: {type: string, description: Model-specific; Qwen Turbo only accepts an empty string}
                seed: {type: integer, minimum: -1, maximum: 18446744073709551615, default: -1}
                width: {type: integer, minimum: 256, maximum: 2048, default: 1024, description: Must satisfy generation.dimension_multiple}
                height: {type: integer, minimum: 256, maximum: 2048, default: 1024, description: Must satisfy generation.dimension_multiple}
                reference_image: {type: string, description: MOSS-only uploaded image filename, not a path}
                denoise: {type: number, minimum: 0.05, maximum: 1, description: MOSS reference-image denoising strength}
                auto_wake: {type: boolean, default: false}
                timeout_seconds: {type: integer, minimum: 15, maximum: 1800, default: 300}
      responses:
        "202": {description: Queued; returns prompt_id, number and job with profile_id/workflow_id/parameters}
        "400": {description: Invalid or unsupported model parameter/workflow/template}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Unknown profile or missing uploaded reference}
        "409": {description: profile_mismatch or wake refused by budget/balance policy}
        "503": {description: asleep; wake the matching profile first or explicitly request auto_wake}
  /_gate/wake:
    post:
      summary: Wake (idempotent; joins an existing session)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: {type: string, description: Must match an existing active profile; otherwise returns profile_mismatch}
                workflows: {type: array, items: {type: string}, description: workflow ids to install (default = non-optional ones)}
      responses:
        "202": {description: this call started a new session}
        "200": {description: joined the session already starting or running}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: unknown profile}
        "409": {description: profile_mismatch or refused by quiet hours / budget / balance}
  /_gate/fetch:
    post:
      summary: Download extra workflows' models onto the running VM (on demand)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflows]
              properties:
                workflows: {type: array, items: {type: string}}
      responses:
        "202": {description: fetch started}
        "400": {description: bad body}
        "404": {description: unknown workflow}
        "409": {description: not_ready or fetch_in_progress}
  /_gate/switch:
    post:
      summary: Switch profile (owner-only by default; v1 = cold switch)
      requestBody: {content: {application/json: {schema: {type: object, required: [profile], properties: {profile: {type: string}}}}}}
      responses: {"202": {description: switching}, "403": {$ref: "#/components/responses/Forbidden"}, "404": {description: unknown profile}, "409": {description: queue_busy or profile_mismatch}}
  /_gate/stop:
    post:
      summary: Stop now and release the Colab VM (owner-only by default)
      responses: {"200": {description: stopped}, "403": {$ref: "#/components/responses/Forbidden"}}
  /_gate/extend:
    post:
      summary: Extend the session by EXTEND_HOURS (owner-only by default)
      responses: {"200": {description: extended}, "409": {description: extend_limit}, "403": {$ref: "#/components/responses/Forbidden"}}
